[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mjev-spatial"
version = "0.2.0"
description = "MJev-Spatial: finite-choice multimodal spatial intelligence with native attention matching"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
inference = [
  "torch>=2.9,<2.10",
  "torchvision>=0.24,<0.25",
  "transformers==5.17.0",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "safetensors>=0.4.5",
  "huggingface-hub>=0.36,<1",
]
train = [
  "torch>=2.9,<2.10",
  "torchvision>=0.24,<0.25",
  "transformers==5.17.0",
  "numpy>=1.26,<3",
  "Pillow>=10",
  "safetensors>=0.4",
  "huggingface-hub>=0.36,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
